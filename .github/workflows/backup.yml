name: Database Backup

# Scheduled workflows are automatically disabled by GitHub after 60 days with no commits
# to the repo -- if this project goes quiet for a while, check the Actions tab
# periodically to confirm backups are still actually running, not silently stopped.
on:
  schedule:
    - cron: '0 3 * * *'   # 3 AM UTC, daily
  workflow_dispatch:       # manual "Run workflow" button, for testing and on-demand backups

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # Ubuntu's own default postgresql-client package lags behind Supabase's actual
      # server version -- hit this directly: server was Postgres 17.6, Ubuntu's default
      # client was only 16.14, and pg_dump refuses to run against a server *newer* than
      # itself (a deliberate safety check -- an older pg_dump can't reliably introspect
      # a newer server's catalog, so it aborts rather than risk a silently-wrong dump).
      # Installing from PGDG's own official repo (not pinned to a specific version)
      # instead of Ubuntu's default one keeps this from breaking again the next time
      # Supabase upgrades its Postgres version.
      # Explicitly versioned (-17), not the generic "postgresql-client" metapackage --
      # ubuntu-latest runners often already have some client version pre-installed, so
      # asking apt for the unversioned name can report "already the newest version"
      # without ever pulling PGDG's actual newer package. Requesting the specific
      # version leaves no ambiguity about which one apt needs to fetch.
      - name: Install postgresql-client-17 (via the official PGDG repo)
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      # -F c (custom format): compressed, and restorable selectively via pg_restore --
      # the generally-recommended format for backups specifically, not an arbitrary
      # choice. PROD_DATABASE_URL is the real Supabase connection string -- a genuine
      # secret, completely separate from ci.yml's throwaway test DATABASE_URL (which is
      # safe to leave in plaintext there since it only ever points at an ephemeral
      # container).
      #
      # Calling the FULL versioned path (/usr/lib/postgresql/17/bin/pg_dump), not the
      # bare "pg_dump" command -- confirmed via a real run's log that installing
      # postgresql-client-17 successfully (17.10 actually got installed) was NOT enough
      # on its own: the bare "pg_dump" on PATH still resolved to Ubuntu's older
      # pre-installed 16.14 build, because Debian/Ubuntu's postgresql-common installs
      # every major version side-by-side under its own /usr/lib/postgresql/<ver>/bin/
      # directory, and update-alternatives (visible in that run's log switching psql's
      # man page) doesn't reliably repoint pg_dump's own symlink to the newest one.
      # Invoking the exact versioned binary sidesteps that resolution entirely --
      # correct regardless of whatever else update-alternatives or PATH decide.
      - name: Dump database
        id: dump
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump
          "$PG_DUMP" --version
          "$PG_DUMP" "$DATABASE_URL" -F c -f "backup-$TIMESTAMP.dump"
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          ls -lh "backup-$TIMESTAMP.dump"

      # Encrypt before upload. This repo is private today, but artifacts sit in Actions
      # history for the full 14-day retention window regardless -- if the repo is ever
      # made public while a backup is still in that window, an unencrypted dump would
      # expose every real row (emails, bcrypt hashes, contest/solve history) to anyone
      # who can list the repo's artifacts. Symmetric AES256 via a single shared
      # passphrase (not a keypair) -- simplest correct option for a one-person setup;
      # the same secret both encrypts here and decrypts locally on restore.
      - name: Encrypt backup
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" \
            -o "backup-${{ steps.dump.outputs.timestamp }}.dump.gpg" \
            "backup-${{ steps.dump.outputs.timestamp }}.dump"
          rm "backup-${{ steps.dump.outputs.timestamp }}.dump"

      # R2 turned out to require a card to activate at all, despite its free tier --
      # switched to GitHub itself instead: no new signup, no card, ever, since this is
      # the same account already authenticated for this repo. Real tradeoff, worth being
      # honest about: this isn't independent infrastructure the way external storage
      # would be -- if something happened to this specific repo, the backups go with
      # it. Given every external option hit a payment wall, that tradeoff is worth it.
      - name: Upload backup as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ steps.dump.outputs.timestamp }}
          path: backup-${{ steps.dump.outputs.timestamp }}.dump.gpg
          retention-days: 14
